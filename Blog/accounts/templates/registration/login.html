{% extends "blogs/base.html" %}

{% block content %}

{% if form.errors %}
    <p>Your username and/or password didn't match. Please try again.</p>
{% endif %}

<form action="{% url 'accounts:login' %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}

    <button name="submit">Login</button>
</form>

{% endblock content %}
