{% extends 'blogs/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
    <h2>Add a new post:</h2>
{% endblock page_header %}

{% block content %}

<h5><a href="{% url 'blogs:blog' blog.slug %}">{{ topic }}</a></h5>

<form action="{% url 'blogs:new_post' blog.slug %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="New Post" %}
</form>

{% endblock content %}
