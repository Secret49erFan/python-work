{% extends 'blogs/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}
    <h2>Edit post:</h2>
{% endblock page_header %}

{% block content %}

<h5><a href="{% url 'blogs:blog' blog.slug %}"> {{ blog }}</a></h5>

<form action="{% url 'blogs:edit_post' post.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Edit Post" %}
</form>

{% endblock content %}
